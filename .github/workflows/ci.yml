name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run compile
      - run: npm test
      - run: npm run build
      # Firefox is a separate manifest shape, so a Chrome-only build proves
      # nothing about it. This also surfaces WXT's gecko warnings as build output.
      - run: npm run build:firefox

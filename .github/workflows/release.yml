name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run zip
      - run: npm run zip:firefox
      # Always expose the zips as run artifacts, so a manual dispatch (no tag)
      # still produces downloadable builds.
      #
      # include-hidden-files is required, not optional: the action skips hidden
      # paths by default and `.output/` is one, so without it every upload here
      # silently finds nothing and the run still goes green.
      - uses: actions/upload-artifact@v4
        with:
          name: korean-anki-miner-chrome
          path: .output/*-chrome.zip
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: korean-anki-miner-firefox
          path: .output/*-firefox.zip
          include-hidden-files: true
      # The sources zip is what AMO wants alongside a bundled submission. Kept as
      # a run artifact only — the repo itself is the published source of truth.
      # Its contents are audited via zip.excludeSources in wxt.config.ts.
      - uses: actions/upload-artifact@v4
        with:
          name: korean-anki-miner-sources
          path: .output/*-sources.zip
          include-hidden-files: true
      # On a version tag, publish a GitHub Release with both zips attached.
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
          generate_release_notes: true
